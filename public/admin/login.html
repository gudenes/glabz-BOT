<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Entrar · Glabs Bot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/admin/portal.css?v=6" />
  </head>
  <body class="login-body">
    <main class="login-card">
      <div class="login-brand">
        <span class="wa-mark" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
            <path d="M12 3a8 8 0 0 0-6.9 12l-1 3.8 3.9-1A8 8 0 1 0 12 3z" fill="currentColor"/>
          </svg>
        </span>
        <div>
          <h1>Glabs Bot</h1>
          <p>WhatsApp do seu negócio, no ar.</p>
        </div>
      </div>

      <form id="form-login" class="login-form">
        <label>
          <span>E-mail</span>
          <input id="email" type="email" autocomplete="username" required placeholder="voce@estudio.com" />
        </label>
        <label>
          <span>Senha</span>
          <input id="password" type="password" autocomplete="current-password" required />
        </label>
        <p id="login-error" class="err hidden"></p>
        <button type="submit" class="btn-wa" id="login-btn">Entrar</button>
      </form>

      <form id="form-change" class="login-form hidden">
        <p class="hint">Primeiro acesso — escolha uma senha nova.</p>
        <label>
          <span>Nova senha</span>
          <input id="new-pass" type="password" autocomplete="new-password" required minlength="6" />
        </label>
        <p id="change-error" class="err hidden"></p>
        <button type="submit" class="btn-wa">Salvar e continuar</button>
      </form>
    </main>
    <script src="/admin/login.js?v=6" type="module"></script>
  </body>
</html>
