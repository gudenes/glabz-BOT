<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Entrar · GLABZ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/admin/portal.css?v=7" />
  </head>
  <body class="login-body">
    <main class="login-wrap">
      <div class="login-copy">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 32 32"><path d="M7 6h10.5c4.2 0 7.5 2.8 7.5 6.4 0 2.4-1.4 4.5-3.6 5.5 2.6.9 4.3 3.2 4.3 5.8 0 3.8-3.5 6.3-8.2 6.3H7V6zm4.4 4.1v4.7h5.4c1.7 0 2.8-.9 2.8-2.3s-1.1-2.4-2.8-2.4H11.4zm0 8.3v5.4h6.2c2 0 3.3-1 3.3-2.7s-1.3-2.7-3.3-2.7h-6.2z" fill="currentColor"/></svg>
          </span>
          <span class="brand-word">GLABZ</span>
        </div>
        <p class="login-kicker">Automação de WhatsApp para o seu negócio</p>
        <h1>WhatsApp do seu negócio, no piloto automático.</h1>
        <p class="login-lead">Conecte o número, desenhe o atendimento, teste como o cliente e publique.</p>
      </div>

      <div class="login-card">
        <form id="form-login" class="login-form">
          <label>
            <span>E-mail</span>
            <input id="email" type="email" autocomplete="username" required placeholder="voce@estudio.com" />
          </label>
          <label>
            <span>Senha</span>
            <input id="password" type="password" autocomplete="current-password" required />
          </label>
          <p id="login-error" class="err hidden"></p>
          <button type="submit" class="btn-lime" id="login-btn">Entrar</button>
        </form>

        <form id="form-change" class="login-form hidden">
          <p class="hint">Primeiro acesso — escolha uma senha nova.</p>
          <label>
            <span>Nova senha</span>
            <input id="new-pass" type="password" autocomplete="new-password" required minlength="6" />
          </label>
          <p id="change-error" class="err hidden"></p>
          <button type="submit" class="btn-lime">Salvar e continuar</button>
        </form>
      </div>
    </main>
    <script src="/admin/login.js?v=7" type="module"></script>
  </body>
</html>
